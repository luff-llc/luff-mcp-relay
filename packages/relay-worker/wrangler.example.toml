name = "your-mcp-relay"
main = "node_modules/luff-mcp-relay/dist/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
RELAY_ORIGIN = "https://your-mcp-relay.YOUR-SUBDOMAIN.workers.dev"
# The door (staging only, off unless all three are set): a pass-through MCP address at /door/mcp.
# DOOR_ISSUER = "https://id.example.com"
# DOOR_JWKS_URL = "https://id.example.com/oauth/jwks"
# DOOR_UPSTREAM_MCP = "https://mcp.example.com/mcp"
# DOOR_SCOPES = "projects:read"   # optional, space-separated

[[durable_objects.bindings]]
name = "TUNNELS"
class_name = "Tunnel"

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[durable_objects.bindings]]
name = "CODES"
class_name = "Codes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tunnel"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gateway"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Codes"]
