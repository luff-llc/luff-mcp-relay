name = "ligature-local"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
RELAY_ORIGIN = "http://localhost:8787"

[[durable_objects.bindings]]
name = "TUNNELS"
class_name = "Tunnel"

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[durable_objects.bindings]]
name = "CODES"
class_name = "Codes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tunnel"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gateway"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Codes"]
